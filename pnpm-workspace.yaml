packages:
  - 'packages/*'
  - 'packages/adapters/*'
  - 'tools/*'
  - 'examples/*'

# better-sqlite3 13 ships prebuilt binaries inside the npm tarball (verified: loads without any
# install script). pnpm only sees the implicit node-gyp rebuild, which must not run: no compiler
# download, no network beyond the registry.
ignoredBuiltDependencies:
  - better-sqlite3
  # esbuild (tools/release, the SEA bundler) has an install script that only swaps its JS shim for the
  # platform binary, as an optimisation. The binary comes from the @esbuild/<platform> optional
  # package either way (verified: `esbuild --version` runs with the script ignored), so no script of
  # any package runs. (pnpm 10.33 still lists it in its "Ignored build scripts" warning; the script
  # does not run.)
  - esbuild
  # koffi (the FFI of @microsoft/tui-test, a dev dependency of packages/tui, N320) has an install script
  # that only copies the prebuilt binary; the binary comes from the @koromix/koffi-<platform> optional
  # package either way (verified: a tui-test session runs with the script ignored).
  - koffi
