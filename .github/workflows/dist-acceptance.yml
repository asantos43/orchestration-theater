name: Dist acceptance

# The acceptance of Phase 10 (P12, docs/21): the distribution as a person meets it, on a runner of each
# system. It builds two single executables (N, 1.0.0, and N+1, 1.0.1) with the public half of a key made
# in the job, serves a signed release from a server on the loopback, and runs
# `otheater-release acceptance` (tools/release/src/acceptance.ts): install, the TUI closed and reopened
# with the daemon and the layout kept, the four refusals (other key, tampered manifest, swapped SHA-256,
# downgrade), the rollback, the update in `idle` and in `park`, and the uninstall that keeps the data.
# It publishes nothing: no release, no tag, no upload. No client runs: the daemon has none configured.
#
# What it reuses instead of repeating: install.sh itself (P5) is what the driver runs to install and to
# uninstall; the real logon service is the one of `install-sh-real.test.ts` (P5, run below on Linux and
# macOS), and the .msi (P4) is the job `msi` that calls dist-msi.yml. [N] The logon service does not
# run the daemon of the driver: where the runner cannot start a user service the report says which path
# ran (service or child daemon), and the driver always uses the child daemon, so the update is the same
# on every system.
#
# [proposta] The repository variable OT_DIST_CI (affected | full | off) is the same one of dist-sea.yml:
# `affected` (default) runs a pull request only when it touches the paths below, `full` always, `off`
# never (a manual dispatch still runs). The variable is not created here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dist-acceptance.yml'
      - 'installer/**'
      - 'tools/release/**'
      - 'packages/daemon/src/updates/**'
      - 'packages/daemon/src/service/**'
      - 'packages/daemon/src/sea/**'
      - 'packages/daemon/src/commands/service*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          MODE: ${{ vars.OT_DIST_CI || 'affected' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(\.github/workflows/dist-acceptance\.yml|installer/|tools/release/|packages/daemon/src/(updates|service|sea)/|packages/daemon/src/commands/service)'; then
            touched=true
          else
            touched=false
          fi
          case "$MODE" in
            affected) build=$touched ;;
            full) build=true ;;
            off) build=false ;;
            *) echo "::error::OT_DIST_CI=$MODE: use affected, full or off"; exit 1 ;;
          esac
          echo "touched=$touched build=$build (mode $MODE)"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    name: acceptance (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: '' }
          - { os: windows-latest, target: win32-x64, ext: '.exe' }
          # `macos-latest` is Apple Silicon.
          - { os: macos-latest, target: darwin-arm64, ext: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The official standalone Node, the one a SEA can be injected into (as in dist-sea.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # The key of the run: it lives in the runner temp folder and ends with the job. Nothing here is
      # the production key (tools/release/keys/update-public-key.pem is never read by this job).
      - name: Key of the run, and the executables N and N+1
        run: |
          node tools/release/dist/cli.js ephemeral-key --out "$RUNNER_TEMP/key"
          node tools/release/dist/cli.js build --target ${{ matrix.target }} --out "$RUNNER_TEMP/n" --version 1.0.0 --public-key "$RUNNER_TEMP/key/ephemeral-public.pem"
          node tools/release/dist/cli.js build --target ${{ matrix.target }} --out "$RUNNER_TEMP/n1" --version 1.0.1 --public-key "$RUNNER_TEMP/key/ephemeral-public.pem"

      # [N] A runner has no login session for the user, so `systemd --user` may have no bus. Linger
      # starts the user manager of the runner user (as in dist-install-sh.yml). Only on this disposable runner.
      - name: Start the user manager (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start "user@$(id -u).service" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      # The LibreSSL of macOS cannot check Ed25519: install.sh falls to ssh-keygen. The openssl@3 of the
      # image, when there is one, only lets the install also exercise the openssl verifier.
      - name: openssl 3 (macOS, optional)
        if: runner.os == 'macOS'
        run: |
          if prefix=$(brew --prefix openssl@3 2>/dev/null) && [ -x "$prefix/bin/openssl" ]; then
            echo "OT_TEST_OPENSSL=$prefix/bin/openssl" >> "$GITHUB_ENV"
          else
            echo "::notice::no openssl@3 on this runner image: install.sh checks with ssh-keygen"
          fi

      - name: Acceptance (install, TUI, refusals, rollback, update idle and park, uninstall)
        run: |
          set -o pipefail
          node tools/release/dist/cli.js acceptance \
            --exe-n "$RUNNER_TEMP/n/${{ matrix.target }}/otheater${{ matrix.ext }}" --version-n 1.0.0 \
            --exe-n1 "$RUNNER_TEMP/n1/${{ matrix.target }}/otheater${{ matrix.ext }}" --version-n1 1.0.1 \
            --key "$RUNNER_TEMP/key/ephemeral-private.pem" \
            --install-script installer/install.sh \
            --work-dir "$RUNNER_TEMP/work" 2>&1 | tee "$RUNNER_TEMP/acceptance.log"
      - name: Report of the acceptance
        if: always()
        run: |
          {
            echo "### Acceptance on ${{ matrix.target }} (daemon: child process of the driver)"
            echo '```'
            cat "$RUNNER_TEMP/acceptance.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The real logon service of the runner, with the executable N: the tests of install.sh (P5) that
      # register the service, check the file, and remove it. Where the runner has no user manager the test
      # warns and goes on: that is the path "service not started here" of the report. [N] Windows: the
      # service is the scheduled task of the .msi, tested by the job `msi` below.
      - name: Real service (install.sh tests of P5)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          pnpm --filter @otheater/daemon exec vitest run src/updates/install-sh --maxWorkers=2 2>&1 | tee "$RUNNER_TEMP/service.log"
        env:
          CI: 'true'
          OT_TEST_REAL_SERVICE: '1'
          OT_TEST_INSTALL_EXE: ${{ runner.temp }}/n/${{ matrix.target }}/otheater
      - name: Report of the service path
        if: always() && runner.os != 'Windows'
        run: |
          {
            echo "### Logon service on ${{ matrix.target }}"
            if grep -q 'no user service manager here' "$RUNNER_TEMP/service.log" 2>/dev/null; then
              echo "Path: the runner has no user service manager; the file of the service was checked, the daemon ran as a child."
            else
              echo "Path: the real service of the runner registered and removed (install-sh-real.test.ts)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up (a service left by a failed run)
        if: always() && runner.os != 'Windows'
        run: sh installer/install.sh --uninstall --yes || true

  # The .msi of P4 (installed for the runner user, checked, removed) is the job of dist-msi.yml, called
  # here for a manual dispatch or `full`: a pull request runs it by its own paths in its own workflow.
  msi:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && vars.OT_DIST_CI == 'full') }}
    uses: ./.github/workflows/dist-msi.yml
    with:
      version: 1.0.0
