name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` reads the crates of native/ offline: the sources must be in the cache first.
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      - run: pnpm check
      - run: cargo fmt --check
        working-directory: native/job-launcher
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: native/job-launcher
      - run: cargo test --locked
        working-directory: native/job-launcher

  cross:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` reads the crates of native/ offline: the sources must be in the cache first.
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      - run: pnpm check

  # Real test of the Windows Job Object launcher (N58): only here the integration tests run.
  windows-launcher:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/job-launcher
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
