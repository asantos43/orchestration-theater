name: CI

on:
  # A branch of a PR runs only the pull_request event: an unfiltered push ran the same tree twice
  # (N163). Main still runs on push, after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, lint, the tests (all or the affected ones, OT_TEST_CI) and verify. On a pull request it
  # waits for `changes` and does not run when the PR only touches documentation and the mode is
  # `light` (job `docs` below). On a push to main and on a
  # dispatch, `changes` is skipped and this job always runs.
  linux:
    needs: [changes]
    # `!cancelled()`: on a push or a dispatch the job `changes` is skipped, and a skipped need would
    # skip this one.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Depth 2: on a pull request HEAD^1 is the tip of the base branch (tools/ci/test-affected.sh).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Layer 3 (the sandbox, P4): bubblewrap confines the client, socat feeds its proxy and
      # ripgrep finds the files to hide. The runner (Ubuntu 26.04, measured in PR #81) restricts user
      # namespaces through AppArmor: the sysctl lifts the general restriction, and the second step
      # unloads the profile that strips the capabilities of what runs inside bwrap (the seccomp
      # helper of the sandbox-runtime needs a nested user namespace). Both ONLY on the disposable
      # runner, never on a developer machine. tmux is for the smoke test of the TUI (P20, N191).
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep tmux
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
      - run: pnpm install --frozen-lockfile
      # The tests of the browser (P6, N95) drive a real Chromium over pages served by the test itself.
      # `playwright-core` does not download one on its own: this is the revision its version expects.
      # It runs the binary of the package the lockfile pins (1.64.1): a bare `npx` at the root does not
      # see it and would fetch the latest version of the package from the registry.
      - run: pnpm --filter @otheater/adapter-browser-playwright exec playwright-core install chromium
      # `pnpm verify` reads the crates of native/ offline: the sources must be in the cache first.
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      # The typed lint (`eslint .`) passed the default ~2 GB heap of Node on a runner (PR #55).
      # OT_REQUIRE_SANDBOX=1: the acceptance tests of the sandbox fail, not skip, if bwrap does not run.
      # OT_REQUIRE_TMUX=1 [proposta]: the same for the smoke test of the TUI, which fails, not skips,
      # if tmux or the build is missing.
      # `pnpm check` in steps, so that the tests can run only where the change reaches (OT_TEST_CI).
      - run: pnpm build && pnpm lint && pnpm format:check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # The tests (owner, 2026-11-21): the repository variable OT_TEST_CI picks the mode on a pull
      # request: `affected` (default: the tests the module graph reaches from the changed files, plus
      # those that run dist/, and the whole suite when a global file changes; tools/ci/test-affected.sh)
      # or `full`. A push to main and a dispatch always run the whole suite.
      - run: bash tools/ci/test-affected.sh HEAD^1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          OT_TEST_CI: ${{ github.event_name == 'pull_request' && (vars.OT_TEST_CI || 'affected') || 'full' }}
          OT_REQUIRE_SANDBOX: '1'
          OT_REQUIRE_TMUX: '1'
      - run: pnpm verify
      - run: cargo fmt --check
        working-directory: native/job-launcher
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: native/job-launcher
      - run: cargo test --locked
        working-directory: native/job-launcher

  # Decides what a pull request runs. A PR is "docs only" when every changed path is under docs/
  # (except docs/reference/, whose api-routes.json the tests check against the code), spikes/ or
  # .claude/, or is a .md at the root or LICENSE.
  # - Windows and macOS (owner, 2026-11-19): the repository variable OT_CROSS_CI picks the mode:
  #   `code` (default: only when the PR is not docs only), `always` or `manual` (dispatch only).
  # - The full suite on linux (owner, 2026-11-21): the variable OT_DOCS_CI picks the mode: `light`
  #   (default: a docs-only PR runs the job `docs` instead) or `full` (always the full suite).
  # - The lint and prettier on Windows and macOS (owner, 2026-11-22): OT_CROSS_LINT, `off` (default)
  #   or `on`; checked here, read by the job `cross`.
  # On a pull request the checkout is the merge commit, so HEAD^1 is the tip of the base branch.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      cross: ${{ steps.decide.outputs.cross }}
      full: ${{ steps.decide.outputs.full }}
      atif: ${{ steps.decide.outputs.atif }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          MODE: ${{ vars.OT_CROSS_CI || 'code' }}
          DOCS_MODE: ${{ vars.OT_DOCS_CI || 'light' }}
          LINT_MODE: ${{ vars.OT_CROSS_LINT || 'off' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -vE '^docs/reference/' | grep -qvE '^(docs/|spikes/|\.claude/|[^/]+\.md$|LICENSE$|$)' \
            || printf '%s\n' "$changed" | grep -qE '^docs/reference/'; then
            code=true
          else
            code=false
          fi
          case "$MODE" in
            always) cross=true ;;
            manual) cross=false ;;
            code) cross=$code ;;
            *) echo "::error::OT_CROSS_CI=$MODE: use code, always or manual"; exit 1 ;;
          esac
          case "$DOCS_MODE" in
            light) full=$code ;;
            full) full=true ;;
            *) echo "::error::OT_DOCS_CI=$DOCS_MODE: use light or full"; exit 1 ;;
          esac
          # OT_CROSS_LINT is read by the job `cross`; a wrong value fails here instead of passing as `off`.
          case "$LINT_MODE" in
            off | on) ;;
            *) echo "::error::OT_CROSS_LINT=$LINT_MODE: use off or on"; exit 1 ;;
          esac
          if printf '%s\n' "$changed" | grep -qE '^(packages/protocol/src/atif/|packages/daemon/src/atif/|packages/daemon/src/phase8-acceptance\.e2e\.test\.ts|tools/atif-validate/)'; then
            atif=true
          else
            atif=false
          fi
          echo "code=$code cross=$cross (mode $MODE) full=$full (mode $DOCS_MODE) atif=$atif"
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "atif=$atif" >> "$GITHUB_OUTPUT"

  # The light path of a docs-only PR (OT_DOCS_CI=light): the checks of `pnpm verify` that read the
  # tree as text (licenses, notices, headers, credentials and catalogs), without building the
  # packages or running the tests. The credential scan matters most: the repository is public.
  # `deps` stays out: it resolves the imports through the built packages and only concerns code.
  # Prettier ignores docs/ and *.md (.prettierignore), so format:check has nothing to say here.
  docs:
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `verify licenses` reads the crates of native/ offline (`cargo metadata --offline`): without
      # this fetch the first docs-only PR (#245) failed with "no matching package named windows-sys".
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      - run: pnpm exec tsc -b tools/verify/tsconfig.src.json
      - run: pnpm verify:docs

  # The trajectories of the ATIF exporter against the TrajectoryValidator of Harbor (Phase 8, P6,
  # N215). It runs on a pull request that touches packages/protocol/src/atif/,
  # packages/daemon/src/atif/, the acceptance of Phase 8 (packages/daemon/src/phase8-acceptance.e2e.test.ts,
  # whose play is validated too, P13) or tools/atif-validate/, and on a dispatch; not on a push to main (the
  # pull request already ran it). The only Python of the CI: uv installs the pinned and hashed
  # `harbor` (0.25.0) and the `pydantic` it needs, without the other dependencies of harbor
  # (tools/atif-validate/requirements.txt). tools/atif-validate/run.sh generates the trajectories of
  # the three units and of the two contents, passes them to the validator, and checks that the files
  # broken on purpose are rejected.
  atif:
    needs: [changes]
    # `!cancelled()`: on a dispatch the job `changes` is skipped, and a skipped need would skip this one.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.atif == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # astral-sh/setup-uv v10.3.3 (2026-10-28), by commit; uv 0.11.3 is the version the script was tried with.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.3
          enable-cache: false
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: bash tools/atif-validate/run.sh

  cross:
    needs: [changes]
    # `!cancelled()`: on a dispatch the job `changes` is skipped, and a skipped need would skip this one.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.cross == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` reads the crates of native/ offline: the sources must be in the cache first.
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      - run: pnpm build
      # The lint and prettier give the same result on every system, and the job `linux` already runs
      # them; on macOS the typed lint alone took 11 min of the 31 of PR #298 (owner, 2026-11-22). The
      # repository variable OT_CROSS_LINT picks the mode: `off` (default) or `on` (run them here too).
      # The typed lint (`eslint .`) passed the default ~2 GB heap of Node on a runner (PR #55).
      - run: pnpm lint && pnpm format:check
        if: ${{ vars.OT_CROSS_LINT == 'on' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # The same mode as on linux (OT_TEST_CI). Git Bash runs the script on Windows.
      - run: bash tools/ci/test-affected.sh HEAD^1
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          OT_TEST_CI: ${{ github.event_name == 'pull_request' && (vars.OT_TEST_CI || 'affected') || 'full' }}
      - run: pnpm verify

  # Real test of the Windows Job Object launcher (N58): only here the integration tests run.
  windows-launcher:
    needs: [changes]
    # `!cancelled()`: on a dispatch the job `changes` is skipped, and a skipped need would skip this one.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.cross == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/job-launcher
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      # Phase 10, P2: the adapter packages/adapters/platform-windows against the launcher just built (it is
      # found in native/job-launcher/target/debug). Its real tests run only where the file exists and the
      # platform is win32: this is the job that runs them (`cross` does not build the launcher, so there
      # they skip, and the daemon tests keep running without a launcher as before).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
        working-directory: .
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm vitest run packages/adapters/platform-windows
        working-directory: .
