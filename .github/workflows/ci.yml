name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Layer 3 (the sandbox, P4): bubblewrap confines the client, socat feeds its proxy,
      # ripgrep finds the files to hide. Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, which stops bubblewrap; the
      # sysctl below lifts that ONLY on the disposable runner (never done on a developer machine).
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` reads the crates of native/ offline: the sources must be in the cache first.
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      # The typed lint (`eslint .`) passed the default ~2 GB heap of Node on a runner (PR #55).
      # OT_REQUIRE_SANDBOX=1: the acceptance tests of the sandbox fail, not skip, if bwrap does not run.
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          OT_REQUIRE_SANDBOX: '1'
      - run: cargo fmt --check
        working-directory: native/job-launcher
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: native/job-launcher
      - run: cargo test --locked
        working-directory: native/job-launcher

  cross:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` reads the crates of native/ offline: the sources must be in the cache first.
      - run: cargo fetch --locked
        working-directory: native/job-launcher
      # The typed lint (`eslint .`) passed the default ~2 GB heap of Node on a runner (PR #55).
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Real test of the Windows Job Object launcher (N58): only here the integration tests run.
  windows-launcher:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/job-launcher
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked

  sandbox-diag:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y bubblewrap socat ripgrep >/dev/null
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ls /etc/apparmor.d | grep -i "bwrap\|userns" || true
          echo "--- outside"; unshare -Ur id
          echo "--- in bwrap"; bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc -- unshare -Ur id
          for f in /etc/apparmor.d/bwrap*; do echo "== $f"; sudo head -40 "$f"; done
          for f in /etc/apparmor.d/bwrap*; do sudo apparmor_parser -R "$f" || true; done
          echo "--- after removing the profiles"; sudo aa-status 2>&1 | grep -i bwrap || true
          echo "--- in bwrap again"; bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc -- unshare -Ur id
        continue-on-error: true
