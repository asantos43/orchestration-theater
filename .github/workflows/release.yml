name: Release

# The release job of Phase 10 (P9, N244, N246) and the gate of R1. Only a manual dispatch starts it: there
# is no `push` (a tag pushed by mistake publishes nothing) and no `schedule`.
#
# THE REHEARSAL always runs, with the gate closed or open: the executables of the three platforms
# (dist-sea.yml), the .msi (dist-msi.yml), the notices, the manifest, the signature with an EPHEMERAL key
# made in the job (never the production one), and the install tests against those very files. Its
# artifacts live one day and hold no secret (the ephemeral private key never leaves the runner).
#
# THE GATE has two locks, and the job `publish` exists only when both are open:
#   1. the input `publish` is true (the intent, run by run);
#   2. the repository variable OT_RELEASE_GATE is `open` (only the owner creates it, after the
#      confirmation from Anthropic; absent or any other value, the gate is closed).
# With the gate closed nothing is published and the summary of the run says why. Even with both open,
# the release is created as a DRAFT: the owner publishes it in the GitHub interface (a second action).
#
# The production signature (the secret OT_UPDATE_SIGNING_KEY) is read only by the job `publish`, which
# is also the only job with `contents: write`. No job but `publish` calls `gh release`
# (tools/release/src/release-workflow.test.ts reads this file and checks it).
#
# CODE SIGNING (P11, N247) is OFF. Two keys, `signing.windows` (off | signtool) and `signing.macos`
# (off | codesign), in tools/release/release.config.json; the repository variables OT_SIGNING_WINDOWS and
# OT_SIGNING_MACOS, when set, win over the file. No account and no certificate exist, so both are `off`:
# the signing steps are skipped and the release is what P9 built (docs/22 says what that means for the
# user). With a key on:
#   - the job `signing` checks the secrets BEFORE anything is built, and fails with a clear message when
#     one is missing (the secrets never appear in an `if`, which GitHub does not allow: they go through
#     `env`);
#   - `sign-windows` and `sign-macos` sign the files of the artifacts and upload them again under the
#     same names, before the manifest hashes them: the SHA-256 of the manifest is the one of the SIGNED
#     file;
#   - they run on `main` only (the certificate is not for a branch).
# The signing secrets are read by those three jobs and by no other (the test reads this file). The ad
# hoc signature that P1 puts on the macOS arm64 executable is not this: it has no certificate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build, like 1.2.3 or 1.2.3-rc.1 (no leading v)'
        type: string
        required: true
      channel:
        description: 'The channel of the release'
        type: choice
        options: [stable, beta]
        default: stable
        required: true
      publish:
        description: 'Create the draft release (it also needs the repository variable OT_RELEASE_GATE=open)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What was asked, checked before anything is built. The values reach the shell only through the
  # environment.
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version and the channel
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$CHANNEL" in
            stable | beta) ;;
            *) echo "::error::channel '$CHANNEL': use stable or beta"; exit 1 ;;
          esac
          echo "version=$VERSION channel=$CHANNEL"

  # The state of the gate, in the summary of the run. It decides nothing: the lock is the `if` of the
  # job `publish`.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Say what the gate is
        env:
          PUBLISH: ${{ inputs.publish }}
          GATE: ${{ vars.OT_RELEASE_GATE }}
        run: |
          {
            if [ "$PUBLISH" != "true" ]; then
              echo "### portão do R1 fechado: ensaio, nada publicado"
              echo
              echo "O input \`publish\` é \`$PUBLISH\`: nenhum release é criado, só o ensaio roda."
            elif [ "$GATE" != "open" ]; then
              echo "### portão do R1 fechado: ensaio, nada publicado"
              echo
              if [ -z "$GATE" ]; then
                echo "A variável de repositório \`OT_RELEASE_GATE\` não existe. Só o dono a cria, com o valor \`open\`, depois da confirmação da Anthropic."
              else
                echo "A variável de repositório \`OT_RELEASE_GATE\` vale \`$GATE\`, e só \`open\` abre o portão."
              fi
            else
              echo "### portão do R1 aberto: o job \`publish\` cria um release em rascunho (draft)"
              echo
              echo "O rascunho só fica público quando o dono o publica pela interface do GitHub."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The code signing keys and their secrets, checked BEFORE anything is built (P11, N247, [proposta]).
  # It has no `if` on purpose: a job that needs a skipped job is skipped too, and the manifest would go
  # with it. With both keys `off` it only says so in the summary.
  signing:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.modes.outputs.windows }}
      macos: ${{ steps.modes.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the signing modes
        id: modes
        env:
          VAR_WINDOWS: ${{ vars.OT_SIGNING_WINDOWS }}
          VAR_MACOS: ${{ vars.OT_SIGNING_MACOS }}
        run: |
          set -eu
          config=tools/release/release.config.json
          from_file() {
            node -p "const s = JSON.parse(require('fs').readFileSync('$config', 'utf8')).signing; s?.[process.argv[1]] ?? 'off'" "$1"
          }
          file_windows=$(from_file windows)
          file_macos=$(from_file macos)
          # The repository variable wins over the file; empty or absent, the file decides.
          windows="${VAR_WINDOWS:-$file_windows}"
          macos="${VAR_MACOS:-$file_macos}"
          case "$windows" in
            off | signtool) ;;
            *) echo "::error::signing.windows '$windows' is not one of: off, signtool"; exit 1 ;;
          esac
          case "$macos" in
            off | codesign) ;;
            *) echo "::error::signing.macos '$macos' is not one of: off, codesign"; exit 1 ;;
          esac
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          {
            echo "### Assinatura de código"
            echo
            echo "- Windows: \`$windows\`"
            echo "- macOS: \`$macos\`"
            if [ "$windows" = off ] && [ "$macos" = off ]; then
              echo
              echo "Desligada nas duas plataformas: nada é assinado e o guia (docs/22) explica o que o usuário vê."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # [proposta] A certificate is used from main only.
      - name: Signing only from main
        if: steps.modes.outputs.windows != 'off' || steps.modes.outputs.macos != 'off'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::code signing is on, and a signed release comes from refs/heads/main (this run is on $GITHUB_REF). Run it on main or set the keys to off."
            exit 1
          fi
      - name: Check the Windows signing secrets
        if: steps.modes.outputs.windows == 'signtool'
        env:
          OT_WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.OT_WINDOWS_SIGNING_CERT_BASE64 }}
          OT_WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.OT_WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          missing=""
          [ -n "$OT_WINDOWS_SIGNING_CERT_BASE64" ] || missing="$missing OT_WINDOWS_SIGNING_CERT_BASE64"
          [ -n "$OT_WINDOWS_SIGNING_CERT_PASSWORD" ] || missing="$missing OT_WINDOWS_SIGNING_CERT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::signing.windows is signtool, but these secrets are missing or empty:$missing. Create them (docs/22) or set signing.windows to off. Nothing was built or published."
            exit 1
          fi
      - name: Check the macOS signing secrets
        if: steps.modes.outputs.macos == 'codesign'
        env:
          OT_MACOS_SIGNING_CERT_BASE64: ${{ secrets.OT_MACOS_SIGNING_CERT_BASE64 }}
          OT_MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.OT_MACOS_SIGNING_CERT_PASSWORD }}
          OT_MACOS_SIGNING_IDENTITY: ${{ secrets.OT_MACOS_SIGNING_IDENTITY }}
          OT_MACOS_NOTARY_APPLE_ID: ${{ secrets.OT_MACOS_NOTARY_APPLE_ID }}
          OT_MACOS_NOTARY_PASSWORD: ${{ secrets.OT_MACOS_NOTARY_PASSWORD }}
          OT_MACOS_NOTARY_TEAM_ID: ${{ secrets.OT_MACOS_NOTARY_TEAM_ID }}
        run: |
          missing=""
          [ -n "$OT_MACOS_SIGNING_CERT_BASE64" ] || missing="$missing OT_MACOS_SIGNING_CERT_BASE64"
          [ -n "$OT_MACOS_SIGNING_CERT_PASSWORD" ] || missing="$missing OT_MACOS_SIGNING_CERT_PASSWORD"
          [ -n "$OT_MACOS_SIGNING_IDENTITY" ] || missing="$missing OT_MACOS_SIGNING_IDENTITY"
          [ -n "$OT_MACOS_NOTARY_APPLE_ID" ] || missing="$missing OT_MACOS_NOTARY_APPLE_ID"
          [ -n "$OT_MACOS_NOTARY_PASSWORD" ] || missing="$missing OT_MACOS_NOTARY_PASSWORD"
          [ -n "$OT_MACOS_NOTARY_TEAM_ID" ] || missing="$missing OT_MACOS_NOTARY_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::signing.macos is codesign, but these secrets are missing or empty:$missing. Create them (docs/22) or set signing.macos to off. Nothing was built or published."
            exit 1
          fi

  # The executables, the notices (dist-sea.yml) and the .msi (dist-msi.yml), as the workflows of P1, P4 and
  # P10 build and test them. `upload` keeps the files as artifacts of this run (one day).
  sea:
    needs: [plan, signing]
    uses: ./.github/workflows/dist-sea.yml
    with:
      version: ${{ inputs.version }}
      upload: true

  msi:
    needs: [plan, signing]
    uses: ./.github/workflows/dist-msi.yml
    with:
      version: ${{ inputs.version }}
      upload: true

  # Windows code signing (P11, N247, [proposta]). Every step that does something has the `if` of the key:
  # with `signing.windows` off the job runs and does nothing. The files are signed in place and uploaded
  # again under the same artifact names, so the manifest below hashes the signed bytes. The .exe inside
  # the .msi is a separate build of dist-msi.yml and is NOT signed here ([N], docs/22).
  sign-windows:
    needs: [signing, sea, msi]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        if: needs.signing.outputs.windows == 'signtool'
        with:
          name: sea-win32-x64
          path: sea
      - uses: actions/download-artifact@v4
        if: needs.signing.outputs.windows == 'signtool'
        with:
          name: msi-win32-x64
          path: msi
      - name: Sign the executable and the .msi
        if: needs.signing.outputs.windows == 'signtool'
        env:
          OT_WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.OT_WINDOWS_SIGNING_CERT_BASE64 }}
          OT_WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.OT_WINDOWS_SIGNING_CERT_PASSWORD }}
          # [proposta] The RFC 3161 server is a repository variable, with a default.
          TIMESTAMP_URL: ${{ vars.OT_SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK of the runner' }
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:OT_WINDOWS_SIGNING_CERT_BASE64))
          try {
            $files = @(Get-ChildItem sea -Filter *.exe) + @(Get-ChildItem msi -Filter *.msi)
            if ($files.Count -ne 2) { throw "expected one .exe and one .msi, found $($files.Count) files" }
            foreach ($file in $files) {
              & $signtool.FullName sign /f $pfx /p $env:OT_WINDOWS_SIGNING_CERT_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed on $($file.Name)" }
              & $signtool.FullName verify /pa /v $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed on $($file.Name)" }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: needs.signing.outputs.windows == 'signtool'
        with:
          name: sea-win32-x64
          path: sea
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: needs.signing.outputs.windows == 'signtool'
        with:
          name: msi-win32-x64
          path: msi
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # macOS code signing and notarization (P11, N247, [proposta]), with a Developer ID certificate. It is
  # not the ad hoc signature of P1. A standalone binary cannot be stapled (Apple, notarization docs), so
  # Gatekeeper finds the ticket online. Same rule as above: every step has the `if` of the key.
  sign-macos:
    needs: [signing, sea]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.signing.outputs.macos == 'codesign'
      - uses: actions/download-artifact@v4
        if: needs.signing.outputs.macos == 'codesign'
        with:
          name: sea-darwin-arm64
          path: sea
      - name: Sign with the Developer ID certificate
        if: needs.signing.outputs.macos == 'codesign'
        env:
          OT_MACOS_SIGNING_CERT_BASE64: ${{ secrets.OT_MACOS_SIGNING_CERT_BASE64 }}
          OT_MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.OT_MACOS_SIGNING_CERT_PASSWORD }}
          OT_MACOS_SIGNING_IDENTITY: ${{ secrets.OT_MACOS_SIGNING_IDENTITY }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/otheater-signing.keychain-db"
          p12="$RUNNER_TEMP/macos-signing.p12"
          keychain_password=$(uuidgen)
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$p12"
          }
          trap cleanup EXIT
          printf '%s' "$OT_MACOS_SIGNING_CERT_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -P "$OT_MACOS_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          exe=$(ls sea/otheater-darwin-arm64)
          # Hardened runtime and a secure timestamp are what notarization asks for. The entitlements are
          # [N]: not tested with a real certificate (docs/22).
          codesign --force --options runtime --timestamp \
            --entitlements tools/release/macos-entitlements.plist \
            --keychain "$keychain" --sign "$OT_MACOS_SIGNING_IDENTITY" "$exe"
          codesign --verify --strict --verbose=2 "$exe"
          # The result must be a real identity, never the ad hoc signature (no Authority line).
          codesign -dv --verbose=4 "$exe" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Authority=Developer ID Application' "$RUNNER_TEMP/codesign.txt" || {
            echo "::error::the signature has no Developer ID Application authority (it looks ad hoc)"
            exit 1
          }
      - name: Notarize
        if: needs.signing.outputs.macos == 'codesign'
        env:
          OT_MACOS_NOTARY_APPLE_ID: ${{ secrets.OT_MACOS_NOTARY_APPLE_ID }}
          OT_MACOS_NOTARY_PASSWORD: ${{ secrets.OT_MACOS_NOTARY_PASSWORD }}
          OT_MACOS_NOTARY_TEAM_ID: ${{ secrets.OT_MACOS_NOTARY_TEAM_ID }}
        run: |
          set -eu
          exe=$(ls sea/otheater-darwin-arm64)
          zip="$RUNNER_TEMP/otheater-notarize.zip"
          ditto -c -k --keepParent "$exe" "$zip"
          result="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$zip" --apple-id "$OT_MACOS_NOTARY_APPLE_ID" --team-id "$OT_MACOS_NOTARY_TEAM_ID" \
            --password "$OT_MACOS_NOTARY_PASSWORD" --wait --output-format json > "$result"
          status=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).status" "$result")
          id=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).id" "$result")
          echo "notarization $id: $status"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --apple-id "$OT_MACOS_NOTARY_APPLE_ID" --team-id "$OT_MACOS_NOTARY_TEAM_ID" \
              --password "$OT_MACOS_NOTARY_PASSWORD" || true
            echo "::error::notarization $id ended '$status', not Accepted"
            exit 1
          fi
          # No stapling: Apple does not staple a standalone binary (the ticket is found online).
      - uses: actions/upload-artifact@v4
        if: needs.signing.outputs.macos == 'codesign'
        with:
          name: sea-darwin-arm64
          path: sea
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The manifest, signed with a key that exists only in this job (the rehearsal), and the checks of the
  # result as the daemon makes them (tools/release `verify` runs the code of daemon/src/updates).
  manifest:
    needs: [plan, sea, msi, signing, sign-windows, sign-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/download-artifact@v4
        with:
          pattern: sea-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: msi-win32-x64
          path: release
      - name: Assemble the manifest
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: node tools/release/dist/cli.js assemble --dir release --version "$VERSION" --channel "$CHANNEL" --schemas-from-build
      - name: Sign with an ephemeral key
        run: |
          # The pair lives in the temporary folder of the runner and is not uploaded. It is not the key of
          # production and it is worth nothing outside this run.
          node tools/release/dist/cli.js ephemeral-key --out "$RUNNER_TEMP/ephemeral"
          # `sign` writes manifest.json.sig (for the daemon and for openssl 3) and manifest.json.sshsig (for
          # ssh-keygen, the verifier that macOS has). `embed-key --manifest` also pins the SHA-256 of the
          # manifest in the script, which is the verifier of last resort (OT_INSTALL_VERIFIER=pinned).
          node tools/release/dist/cli.js sign --manifest release/manifest.json --key-file "$RUNNER_TEMP/ephemeral/ephemeral-private.pem"
          node tools/release/dist/cli.js embed-key --script installer/install.sh --public-key "$RUNNER_TEMP/ephemeral/ephemeral-public.pem" --manifest release/manifest.json --out release/install.sh
          cp "$RUNNER_TEMP/ephemeral/ephemeral-public.pem" release/ephemeral-public.pem
      - name: Check the release as the daemon does
        run: node tools/release/dist/cli.js verify --manifest release/manifest.json --public-key release/ephemeral-public.pem --dir release
      - name: Summary
        run: |
          {
            echo "### Ensaio: release assinado com chave efêmera"
            echo
            echo '```'
            ls -l release
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-release
          path: release
          if-no-files-found: error
          retention-days: 1

  # The install tests against the files of the rehearsal: install.sh with the ephemeral key embedded,
  # served from a loopback server, on the two systems it supports. The .msi of the rehearsal has
  # already been installed and removed on Windows by dist-msi.yml.
  install-check:
    needs: [plan, manifest]
    name: install.sh (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          # `macos-latest` is Apple Silicon.
          - { os: macos-latest, target: darwin-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rehearsal-release
          path: release
      # The LibreSSL of macOS cannot check Ed25519, and that is no longer a requirement: install.sh
      # tries openssl 3, then ssh-keygen (the .sshsig of the release) and then the pinned SHA-256 of the
      # manifest, and refuses (exit 3) when none can. The next step runs each verifier on its own.
      - name: Install from the rehearsal release (each verifier)
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          python3 -m http.server 8765 --bind 127.0.0.1 --directory release >"$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          # `auto` is what a user runs. `ssh-keygen` and `pinned` prove the two fallbacks on their own.
          # `openssl` only where the runner has an openssl 3 (the LibreSSL of macOS has no Ed25519).
          verifiers="auto ssh-keygen pinned"
          if openssl version 2>/dev/null | grep -q '^OpenSSL 3'; then verifiers="$verifiers openssl"; fi
          for verifier in $verifiers; do
            export HOME="$RUNNER_TEMP/home-$verifier"
            mkdir -p "$HOME"
            OT_INSTALL_VERIFIER="$verifier" \
              OT_INSTALL_BASE_URL=http://127.0.0.1:8765 OT_INSTALL_CHANNEL="$CHANNEL" OT_INSTALL_SERVICE=off \
              sh release/install.sh
            exe="$HOME/.local/share/otheater/bin/otheater"
            test -x "$exe"
            installed=$("$exe" --version | head -n 1)
            echo "installed ($verifier): $installed"
            case "$installed" in
              *"$VERSION"*) ;;
              *) echo "::error::the executable says '$installed', and the release is $VERSION"; exit 1 ;;
            esac
            test -s "$HOME/.local/share/otheater/THIRD_PARTY_NOTICES.md"
            echo "- ${{ matrix.target }}, verifier $verifier: installed $installed from the rehearsal release" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: A manifest changed after it was signed is refused
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          # The same files and the same key, but the manifest differs by one space from what was signed.
          cp -R release tampered
          sed 's/"schema": 1/"schema":  1/' release/manifest.json > tampered/manifest.json
          python3 -m http.server 8766 --bind 127.0.0.1 --directory tampered >"$RUNNER_TEMP/server2.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          verifiers="ssh-keygen pinned"
          if openssl version 2>/dev/null | grep -q '^OpenSSL 3'; then verifiers="$verifiers openssl"; fi
          for verifier in $verifiers; do
            export HOME="$RUNNER_TEMP/home2-$verifier"
            mkdir -p "$HOME"
            status=0
            OT_INSTALL_VERIFIER="$verifier" OT_INSTALL_BASE_URL=http://127.0.0.1:8766 OT_INSTALL_CHANNEL="$CHANNEL" OT_INSTALL_SERVICE=off sh release/install.sh || status=$?
            if [ "$status" != 3 ]; then
              echo "::error::($verifier) a manifest that does not match its signature must end with exit 3, and it ended with $status"
              exit 1
            fi
            test ! -e "$HOME/.local/share/otheater/bin/otheater"
          done

  # The only job that publishes. Both locks are in the `if`: the input and the variable of the
  # repository. It signs with the production key after checking it, and creates the release as a draft.
  publish:
    needs: [plan, sea, msi, signing, sign-windows, sign-macos, manifest, install-check]
    if: inputs.publish == true && vars.OT_RELEASE_GATE == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # [proposta] A release comes from main: the executables embed the public key of this very tree.
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release is made from refs/heads/main, and this run is on $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # The three checks before signing (docs/21, P9). The secret is read here and in the next step only.
      - name: Check the production key
        env:
          OT_UPDATE_SIGNING_KEY: ${{ secrets.OT_UPDATE_SIGNING_KEY }}
        run: node tools/release/dist/cli.js check-key --key-env OT_UPDATE_SIGNING_KEY --public-key tools/release/keys/update-public-key.pem
      # The files of the rehearsal, without the manifest and the rest that carry the ephemeral key.
      - uses: actions/download-artifact@v4
        with:
          pattern: sea-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: msi-win32-x64
          path: release
      - name: Assemble, sign with the production key and check
        env:
          OT_UPDATE_SIGNING_KEY: ${{ secrets.OT_UPDATE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          cli="node tools/release/dist/cli.js"
          $cli assemble --dir release --version "$VERSION" --channel "$CHANNEL" --schemas-from-build
          $cli sign --manifest release/manifest.json --key-env OT_UPDATE_SIGNING_KEY
          $cli verify --manifest release/manifest.json --public-key tools/release/keys/update-public-key.pem --dir release
          $cli embed-key --script installer/install.sh --public-key tools/release/keys/update-public-key.pem --manifest release/manifest.json --out release/install.sh
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          flags=(--draft --target "$GITHUB_SHA" --title "v$VERSION" --notes "Draft: the owner publishes it.")
          if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "${flags[@]}" release/*
          echo "### Release v$VERSION criado em rascunho (draft)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Só o dono o publica, pela interface do GitHub." >> "$GITHUB_STEP_SUMMARY"
