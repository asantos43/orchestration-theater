name: Dist SEA

# The single executable (Node SEA, Phase 10, P1) built on a runner of each platform, and its smoke
# test. It publishes nothing: no release, no tag, no release asset. The job only writes the size of
# each executable to its summary.
#
# P9: release.yml calls this workflow (`workflow_call`) for the rehearsal of the release. The inputs are
# optional and empty in every other event, so the behavior of a push, a pull request or a manual
# dispatch does not change: `version` bakes a version into the executables, and `upload` keeps them as
# a workflow artifact (`sea-<target>`, one day, nothing secret) for the next jobs of that run.
on:
  # Main runs after each merge that touches the paths below. A pull request is decided by the job
  # `changes` (a `paths:` filter on the event would leave a pending status when nothing matches).
  push:
    branches: [main]
    paths:
      - '.github/workflows/dist-sea.yml'
      - 'tools/release/**'
      - 'tools/verify/**'
      - 'native/job-launcher/THIRD_PARTY_NOTICES.md'
      - 'packages/daemon/src/sea/**'
      - 'packages/daemon/src/cli.ts'
      - 'packages/daemon/src/version.ts'
      - 'packages/daemon/src/i18n.ts'
      - 'packages/daemon/src/mcp/**'
      - 'packages/daemon/src/profiles/shims.ts'
      - 'packages/tui/src/launcher.ts'
      - 'packages/tui/src/locale.ts'
      - 'packages/tui/src/main.ts'
      - 'packages/tui/src/run-main.ts'
      - 'packages/tui/src/ink-patch.ts'
      - 'packages/tui/patches/**'
      - 'packages/client/src/node/**'
      - 'packages/adapters/prompts-files/src/**'
      - 'locales/**'
      - 'prompts/**'
      - 'pnpm-lock.yaml'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'A version (x.y.z) baked into the executables instead of the one of the package'
        type: string
        required: false
        default: ''
      upload:
        description: 'Keep the executables and the notices as the workflow artifact sea-<target> (1 day)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # In a called workflow `github.workflow` is the name of the caller, so a release rehearsal and the
  # push of the same ref do not cancel each other.
  group: dist-sea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request builds the executables, by the repository variable OT_DIST_CI
  # [proposta], as OT_CROSS_CI does for the other platforms:
  # - `affected` (default): only when the PR touches one of the paths above;
  # - `full`: every PR;
  # - `off`: none (a dispatch still runs).
  # On a pull request the checkout is the merge commit, so HEAD^1 is the tip of the base branch.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          MODE: ${{ vars.OT_DIST_CI || 'affected' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(\.github/workflows/dist-sea\.yml|tools/release/|tools/verify/|native/job-launcher/THIRD_PARTY_NOTICES\.md$|packages/daemon/src/sea/|packages/daemon/src/(cli|version|i18n)\.ts$|packages/daemon/src/mcp/|packages/daemon/src/profiles/shims\.ts$|packages/tui/src/(launcher|locale|main|run-main|ink-patch)\.ts$|packages/tui/patches/|packages/client/src/node/|packages/adapters/prompts-files/src/|locales/|prompts/|pnpm-lock\.yaml$)'; then
            touched=true
          else
            touched=false
          fi
          case "$MODE" in
            affected) build=$touched ;;
            full) build=true ;;
            off) build=false ;;
            *) echo "::error::OT_DIST_CI=$MODE: use affected, full or off"; exit 1 ;;
          esac
          echo "touched=$touched build=$build (mode $MODE)"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  sea:
    needs: [changes]
    # `!cancelled()`: on a push or a dispatch the job `changes` is skipped, and a skipped need would
    # skip this one.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    name: sea (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win32-x64 }
          # `macos-latest` is Apple Silicon.
          - { os: macos-latest, target: darwin-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The Node of setup-node is the official standalone build, the one a SEA can be injected into
      # (the Node of a distribution package is not). The blob has to come from the same binary.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # `OT_RELEASE_VERSION` is empty outside the release rehearsal: the build then keeps the version of
      # the package. It goes through the environment, never into the text of the command.
      - name: Build the single executable
        env:
          OT_RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/release/dist/cli.js build --target ${{ matrix.target }} --out dist/sea ${OT_RELEASE_VERSION:+--version "$OT_RELEASE_VERSION"}
      # The acceptance of the build: --version, the daemon in a temporary folder and its API, the TUI
      # without a real terminal, the MCP shim by internal mode, and the modes of later steps.
      - name: Smoke test
        env:
          OT_RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/release/dist/cli.js smoke dist/sea/${{ matrix.target }}/otheater${{ matrix.target == 'win32-x64' && '.exe' || '' }} ${OT_RELEASE_VERSION:+--version "$OT_RELEASE_VERSION"}
      # The notices of the platform (P10): the build already generated THIRD_PARTY_NOTICES-<target>.md
      # next to the executable; this checks it again against the graph of the platform (no package
      # missing or extra, no build tool) and fails when it is not there.
      - name: Notices of the platform
        run: |
          notices="dist/sea/${{ matrix.target }}/THIRD_PARTY_NOTICES-${{ matrix.target }}.md"
          node tools/verify/dist/cli.js notices --check --platform ${{ matrix.target }} --metafile dist/sea/${{ matrix.target }}/metafile.json --out "$notices"
          echo "- ${{ matrix.target }} notices: $(grep -c '^### ' "$notices") packages" >> "$GITHUB_STEP_SUMMARY"
      - name: Size of the executable
        run: |
          exe="dist/sea/${{ matrix.target }}/otheater${{ matrix.target == 'win32-x64' && '.exe' || '' }}"
          bytes=$(wc -c < "$exe")
          echo "${{ matrix.target }}: $bytes bytes"
          echo "- ${{ matrix.target }}: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
      # Release rehearsal (P9): the files as the release names them, otheater-<platform>[.exe] and
      # THIRD_PARTY_NOTICES-<platform>.md. A workflow artifact for this run only: one day, no secret.
      - name: Keep the executable and the notices for the rehearsal
        if: inputs.upload == true
        run: |
          mkdir -p upload
          cp "dist/sea/${{ matrix.target }}/otheater${{ matrix.target == 'win32-x64' && '.exe' || '' }}" "upload/otheater-${{ matrix.target }}${{ matrix.target == 'win32-x64' && '.exe' || '' }}"
          cp "dist/sea/${{ matrix.target }}/THIRD_PARTY_NOTICES-${{ matrix.target }}.md" upload/
      - name: Upload the rehearsal files
        if: inputs.upload == true
        uses: actions/upload-artifact@v4
        with:
          name: sea-${{ matrix.target }}
          path: upload/*
          if-no-files-found: error
          retention-days: 1
