name: Dist MSI

# The .msi of Phase 10 (P4), built with WiX on a Windows runner and tested by really installing it for
# the runner user and removing it (installer/wix/test-install.ps1). It publishes nothing: no release,
# no tag. [proposta] Only a manual dispatch keeps the .msi as a workflow artifact (7 days), for the
# owner to try it on a real Windows (SmartScreen, logon); the release (P9) is another job.
#
# P9: release.yml calls this workflow (`workflow_call`) for the rehearsal of the release. The inputs are
# optional and empty in every other event, so the behavior of a push, a pull request or a manual
# dispatch does not change: `version` sets the version of the executable and of the .msi, and `upload`
# keeps the .msi as the workflow artifact `msi-win32-x64` (1 day, nothing secret) for that run.
#
# WiX: the pinned version below (5.0.2, the same as installer/wix/build.ps1) is installed as a .NET tool,
# only on this runner (N249; the owner chose series 5, MS-RL, on 2026-11-22). It has no EULA to accept, and
# no acceptance command is written here: see the license note in installer/wix/build.ps1.
on:
  # Main runs after each merge that touches the paths below. A pull request is decided by the job
  # `changes` (a `paths:` filter on the event would leave a pending status when nothing matches).
  push:
    branches: [main]
    paths:
      - '.github/workflows/dist-msi.yml'
      - 'installer/wix/**'
      - 'tools/release/**'
      - 'native/job-launcher/**'
      - 'packages/daemon/src/sea/**'
      - 'packages/daemon/src/service/**'
      - 'packages/daemon/src/commands/service*'
      - 'pnpm-lock.yaml'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'A version (x.y.z) for the executable and the .msi instead of the one of the package'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'A version (x.y.z) for the executable and the .msi instead of the one of the package'
        type: string
        required: false
        default: ''
      upload:
        description: 'Keep the .msi as the workflow artifact msi-win32-x64 (1 day)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # In a called workflow `github.workflow` is the name of the caller, so a release rehearsal and the
  # push of the same ref do not cancel each other.
  group: dist-msi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep equal to $WixVersion of installer/wix/build.ps1 (tools/release/src/msi-sources.test.ts checks it).
  WIX_VERSION: '5.0.2'

jobs:
  # Decides whether a pull request builds and tests the .msi, by the repository variable OT_DIST_CI, the
  # same one as dist-sea.yml [proposta]:
  # - `affected` (default): only when the PR touches one of the paths below;
  # - `full`: every PR;
  # - `off`: none (a dispatch still runs).
  # On a pull request the checkout is the merge commit, so HEAD^1 is the tip of the base branch.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          MODE: ${{ vars.OT_DIST_CI || 'affected' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(\.github/workflows/dist-msi\.yml|installer/wix/|tools/release/|native/job-launcher/|packages/daemon/src/(sea|service)/|packages/daemon/src/commands/(service|vault)|pnpm-lock\.yaml$)'; then
            touched=true
          else
            touched=false
          fi
          case "$MODE" in
            affected) build=$touched ;;
            full) build=true ;;
            off) build=false ;;
            *) echo "::error::OT_DIST_CI=$MODE: use affected, full or off"; exit 1 ;;
          esac
          echo "touched=$touched build=$build (mode $MODE)"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  msi:
    needs: [changes]
    # `!cancelled()`: on a push or a dispatch the job `changes` is skipped, and a skipped need would
    # skip this one.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    runs-on: windows-latest
    # A normal run takes about 5 minutes; a hung step fails here instead of holding the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # The single executable of P1 (as dist-sea.yml builds it) and the launcher of P2.
      - name: Build the single executable (win32-x64)
        shell: bash
        env:
          OT_RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/release/dist/cli.js build --target win32-x64 --out dist/sea ${OT_RELEASE_VERSION:+--version "$OT_RELEASE_VERSION"}
      - name: Build the launcher
        working-directory: native/job-launcher
        run: cargo build --release --locked
      # WiX, pinned: `dotnet tool install` asks for no acceptance. The SDK is the one of the runner
      # image; the roll-forward lets a tool made for .NET 6 (WiX 5) run on a newer runtime [N].
      - name: Install WiX ${{ env.WIX_VERSION }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the .msi
        id: build
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          OT_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Empty outside the release rehearsal: build.ps1 then reads the version of the config.
          # A hashtable splat binds by name; an array splat would pass '-Version' as a positional
          # value (it landed in -Exe, and the version in -Launcher).
          $extra = @{}
          if ($env:OT_RELEASE_VERSION) { $extra = @{ Version = $env:OT_RELEASE_VERSION } }
          ./installer/wix/build.ps1 @extra
      # Probes of N322, each with its own time limit, before the full test: two runs of the test
      # hung on 2026-11-25 until the runner was lost, with no log. The steps of the job (the API
      # keeps their times even when the log is lost) say which part got through. [proposta] They
      # go away once the cause is known.
      - name: 'Probe: ot vault use and status, no msiexec'
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path dist\sea\win32-x64\otheater.exe).Path
          $data = Join-Path $env:RUNNER_TEMP 'ot-probe-data'
          & $exe --data-dir $data vault use encrypted-file
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --data-dir $data vault status --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force $data
      - name: 'Probe: msiexec with no action of ot (VAULT=keep, no service, no adapters)'
        timeout-minutes: 6
        env:
          MSI: ${{ steps.build.outputs.msi }}
        run: ./installer/wix/probe-msi.ps1 -Msi $env:MSI -Properties 'VAULT=keep', 'LOGON_SERVICE=0', 'PREFETCH_ADAPTERS=0'
      - name: 'Probe: msiexec with ot vault use only (VAULT=encrypted-file)'
        timeout-minutes: 6
        env:
          MSI: ${{ steps.build.outputs.msi }}
        run: ./installer/wix/probe-msi.ps1 -Msi $env:MSI -Properties 'VAULT=encrypted-file', 'LOGON_SERVICE=0', 'PREFETCH_ADAPTERS=0'
      - name: Install, check, uninstall, check
        timeout-minutes: 20
        env:
          MSI: ${{ steps.build.outputs.msi }}
          SEMVER: ${{ steps.build.outputs.semver }}
        run: ./installer/wix/test-install.ps1 -Msi $env:MSI -SemVer $env:SEMVER
      - name: Size of the package
        run: |
          $msi = Get-Item "${{ steps.build.outputs.msi }}"
          "- $($msi.Name): $($msi.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Keep the package for a manual try
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: otheater-msi
          path: ${{ steps.build.outputs.msi }}
          retention-days: 7
      # Release rehearsal (P9): the .msi for the manifest job. This run only: one day, no secret.
      - name: Keep the package for the rehearsal
        if: inputs.upload == true
        uses: actions/upload-artifact@v4
        with:
          name: msi-win32-x64
          path: ${{ steps.build.outputs.msi }}
          if-no-files-found: error
          retention-days: 1
